name: nail_art_app
description: Nail Art Design Application - Clean Architecture with Cubit
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Functional Programming
  dartz: ^0.10.1

  # Network
  dio: ^5.3.2

  # Local Storage
  shared_preferences: ^2.2.1

  # Navigation
  go_router: ^12.1.1

  # Image
  cached_network_image: ^3.3.0

  # UI
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
